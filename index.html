<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Leinard Artajo Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A sleek, interactive personal portfolio website built with React. Showcasing projects, skills, and contact information." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://leinardartajoportfolio.vercel.app/" />
    <meta property="og:title" content="Leinard Artajo | Developer Portfolio" />
    <meta property="og:description" content="A sleek, interactive personal portfolio website showcasing projects, skills, and contact information." />
    <meta property="og:image" content="https://i.imgur.com/cwXM5tm.jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://leinardartajoportfolio.vercel.app/" />
    <meta name="twitter:title" content="Leinard Artajo | Developer Portfolio" />
    <meta name="twitter:description" content="A sleek, interactive personal portfolio website showcasing projects, skills, and contact information." />
    <meta name="twitter:image" content="https://i.imgur.com/cwXM5tm.jpeg" />

    <!-- SVG first so it stays crisp; PNG covers browsers that skip SVG icons. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
